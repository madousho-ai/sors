[project]
name = "sors"
description = "State-conditioned Option Ranking System"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.0.1",
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "peft>=0.21.0",
    "safetensors>=0.8.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "netcal>=1.4.0",
    "scikit-learn>=1.9.1",
    "tensorboard>=2.21.0",
    "torchmetrics>=1.9.0",
]
gpu = [
    "kernels>=0.16.2,<0.17",
    "flash-linear-attention==0.5.2",
]
gpu-fa4 = [
    "apache-tvm-ffi",
    "nvidia-cutlass-dsl",
]
