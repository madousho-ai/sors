<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="diagram-title diagram-description" font-family="Inter, Helvetica, Arial, sans-serif" fill="#1f2937">
  <title id="diagram-title">SORS — State-conditioned Option Ranking System</title>
  <desc id="diagram-description">The caller supplies a state, a question, and options. The shared state-and-question prefix is encoded once. Each separate branch appends exactly one option, always marked with &lt;|D1|&gt;, and Answer:. The fully fine-tuned Qwen3.5-2B-Base text backbone reads state, question, and that one option causally, using the same decoder stack for every branch. The final hidden state at the last token of Answer: feeds a scalar head w · h. The head is initialized as e(&lt;|D1|&gt;) − e(&lt;|D2|&gt;), giving the language model's next-token log-odds of D1 (this option fits) versus D2 (it does not). Softmax over this question's options yields Cancel a subscription 0.97, Reset a password 0.02, and Track a shipment 0.01. The bottom panel shows the two training stages and three training settings.</desc>
  <defs>
    <marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#6b7280"/>
    </marker>
    <marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- An opaque canvas preserves the diagram's contrast in either README theme. -->
  <rect width="1200" height="900" fill="#ffffff"/>
  <text x="22" y="36" font-size="21" font-weight="600">SORS — State-conditioned Option Ranking System</text>
  <text x="22" y="65" font-size="14" fill="#4b5563">Independent option branches → one score each → a probability distribution over the caller's menu</text>

  <g font-size="15" font-weight="600" fill="#374151">
    <text x="22" y="109">Request</text>
    <text x="282" y="109">One branch per option</text>
    <text x="628" y="109">Text backbone</text>
    <text x="826" y="109">Scalar readout</text>
    <text x="1006" y="109">Output</text>
  </g>

  <!-- The caller chooses the state, question, and complete menu. -->
  <rect x="22" y="130" width="232" height="452" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <g font-size="13">
    <text x="38" y="160" font-weight="600">State</text>
    <text x="38" y="185">
      <tspan x="38">I need to cancel my</tspan>
      <tspan x="38" dy="20">subscription before it</tspan>
      <tspan x="38" dy="20">renews.</tspan>
    </text>
    <text x="38" y="266" font-weight="600">Question</text>
    <text x="38" y="291">
      <tspan x="38">What does the</tspan>
      <tspan x="38" dy="20">customer want?</tspan>
    </text>
    <text x="38" y="352" font-weight="600">Caller-defined options</text>
    <text x="38" y="380">Cancel a subscription</text>
    <text x="38" y="407">Reset a password</text>
    <text x="38" y="434">Track a shipment</text>
  </g>

  <!-- The common prefix is encoded once; the fan-out supplies it to each suffix. -->
  <path d="M 254 204 L 281 204" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#gray-arrow)"/>
  <rect x="282" y="130" width="310" height="152" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="298" y="157" font-size="14" font-weight="600">Shared prefix · encoded once</text>
  <g font-family="monospace" font-size="12">
    <text x="298" y="182">
      <tspan x="298">Customer message: I need to</tspan>
      <tspan x="298" dy="18">cancel my subscription before</tspan>
      <tspan x="298" dy="18">it renews.</tspan>
    </text>
    <text x="298" y="244">
      <tspan x="298">Question: What does the</tspan>
      <tspan x="298" dy="18">customer want?</tspan>
    </text>
  </g>
  <g fill="none" stroke="#6b7280" stroke-width="1.5">
    <path d="M 437 282 L 437 303 L 270 303 L 270 535"/>
    <path d="M 270 355 L 281 355" marker-end="url(#gray-arrow)"/>
    <path d="M 270 445 L 281 445" marker-end="url(#gray-arrow)"/>
    <path d="M 270 535 L 281 535" marker-end="url(#gray-arrow)"/>
  </g>

  <!-- Each suffix contains the same D1 marker and exactly one option. -->
  <g fill="#eff6ff" stroke="#2563eb" stroke-width="1.2">
    <rect x="282" y="320" width="310" height="70" rx="6"/>
    <rect x="282" y="410" width="310" height="70" rx="6"/>
    <rect x="282" y="500" width="310" height="70" rx="6"/>
  </g>
  <g font-family="monospace" font-size="12">
    <text x="298" y="345">Option: <tspan fill="#2563eb" font-weight="700">&lt;|D1|&gt;</tspan> Cancel a subscription</text>
    <text x="298" y="370">Answer:</text>
    <text x="298" y="435">Option: <tspan fill="#2563eb" font-weight="700">&lt;|D1|&gt;</tspan> Reset a password</text>
    <text x="298" y="460">Answer:</text>
    <text x="298" y="525">Option: <tspan fill="#2563eb" font-weight="700">&lt;|D1|&gt;</tspan> Track a shipment</text>
    <text x="298" y="550">Answer:</text>
  </g>

  <!-- The three stack icons denote the same backbone applied to separate sequences. -->
  <rect x="628" y="130" width="170" height="452" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="713" y="160" font-size="13" font-weight="600">Qwen3.5-2B-Base</text>
    <text x="713" y="183" font-size="12" fill="#4b5563">Fully fine-tuned</text>
    <text x="713" y="218" font-size="12" font-weight="600">Causal reading</text>
    <text x="713" y="241" font-size="12">state → question</text>
    <text x="713" y="261" font-size="12">→ that one option</text>
    <text x="713" y="294" font-size="12" fill="#4b5563">Same decoder stack</text>
  </g>
  <g stroke="#9ca3af" stroke-width="1.2">
    <rect x="644" y="328" width="138" height="38" rx="4" fill="#f9fafb"/>
    <rect x="644" y="334" width="138" height="38" rx="4" fill="#f3f4f6"/>
    <rect x="644" y="340" width="138" height="38" rx="4" fill="#e5e7eb"/>
    <rect x="644" y="418" width="138" height="38" rx="4" fill="#f9fafb"/>
    <rect x="644" y="424" width="138" height="38" rx="4" fill="#f3f4f6"/>
    <rect x="644" y="430" width="138" height="38" rx="4" fill="#e5e7eb"/>
    <rect x="644" y="508" width="138" height="38" rx="4" fill="#f9fafb"/>
    <rect x="644" y="514" width="138" height="38" rx="4" fill="#f3f4f6"/>
    <rect x="644" y="520" width="138" height="38" rx="4" fill="#e5e7eb"/>
  </g>
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="713" y="363">Decoder layers</text>
    <text x="713" y="453">Decoder layers</text>
    <text x="713" y="543">Decoder layers</text>
  </g>
  <g fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#gray-arrow)">
    <path d="M 592 355 L 643 355"/>
    <path d="M 592 445 L 643 445"/>
    <path d="M 592 535 L 643 535"/>
  </g>

  <!-- Only the final hidden state of each branch reaches the shared scalar head. -->
  <rect x="826" y="130" width="152" height="452" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="902" y="159" font-size="12">Final hidden state</text>
    <text x="902" y="180" font-size="12">at last token of</text>
    <text x="902" y="201" font-family="monospace" font-size="13" font-weight="600">Answer:</text>
    <text x="902" y="240" font-size="14" font-weight="600" fill="#2563eb">Scalar head</text>
    <text x="902" y="264" font-size="12">One score / option</text>
  </g>
  <g fill="#ffffff" stroke="#2563eb" stroke-opacity="0.4" stroke-width="1.2">
    <rect x="840" y="330" width="124" height="50" rx="5"/>
    <rect x="840" y="420" width="124" height="50" rx="5"/>
    <rect x="840" y="510" width="124" height="50" rx="5"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="902" y="360">w · h → s1</text>
    <text x="902" y="450">w · h → s2</text>
    <text x="902" y="540">w · h → s3</text>
  </g>
  <g fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#blue-arrow)">
    <path d="M 782 355 L 839 355"/>
    <path d="M 782 445 L 839 445"/>
    <path d="M 782 535 L 839 535"/>
  </g>

  <!-- All three scores are normalized together, over this question's menu only. -->
  <rect x="1006" y="130" width="172" height="452" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="1092" y="160" font-size="13" font-weight="600">Menu-only softmax</text>
    <text x="1092" y="183" font-size="12" fill="#4b5563">This question's</text>
    <text x="1092" y="203" font-size="12" fill="#4b5563">options only</text>
  </g>
  <g font-size="12">
    <text x="1020" y="341">Cancel a subscription</text>
    <text x="1020" y="431">Reset a password</text>
    <text x="1020" y="521">Track a shipment</text>
  </g>
  <g font-size="14" font-weight="600" text-anchor="end">
    <text x="1164" y="364">0.97</text>
    <text x="1164" y="454">0.02</text>
    <text x="1164" y="544">0.01</text>
  </g>
  <g fill="#e5e7eb">
    <rect x="1020" y="373" width="144" height="8" rx="2"/>
    <rect x="1020" y="463" width="144" height="8" rx="2"/>
    <rect x="1020" y="553" width="144" height="8" rx="2"/>
  </g>
  <g fill="#2563eb">
    <rect x="1020" y="373" width="139.68" height="8" rx="2"/>
    <rect x="1020" y="463" width="2.88" height="8" rx="1"/>
    <rect x="1020" y="553" width="1.44" height="8" rx="0.7"/>
  </g>
  <g fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#blue-arrow)">
    <path d="M 964 355 L 1005 355"/>
    <path d="M 964 445 L 1005 445"/>
    <path d="M 964 535 L 1005 535"/>
  </g>

  <!-- Initialization and independence describe the released scoring mechanism. -->
  <rect x="22" y="600" width="500" height="100" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="38" y="625" font-size="14" font-weight="600">Head initialization</text>
  <text x="38" y="650" font-family="monospace" font-size="13">w = e(&lt;|D1|&gt;) − e(&lt;|D2|&gt;)</text>
  <text x="38" y="672" font-size="12">Initial score: LM next-token log-odds</text>
  <text x="38" y="690" font-size="12">&lt;|D1|&gt; (fits) vs &lt;|D2|&gt; (does not fit)</text>
  <rect x="542" y="600" width="636" height="100" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="558" y="625" font-size="14" font-weight="600" fill="#2563eb">One option per sequence</text>
  <text x="558" y="650" font-size="13">Separate sequences: shared prefix + exactly one option.</text>
  <text x="558" y="672" font-size="13">
    <tspan x="558">Options are scored independently, so reordering the menu</tspan>
    <tspan x="558" dy="18">only reorders the scores.</tspan>
  </text>

  <!-- Only the first two cards are sequential training stages. -->
  <rect x="22" y="716" width="1156" height="178" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="38" y="740" font-size="16" font-weight="600" fill="#2563eb">Training</text>
  <g fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.35" stroke-width="1.2">
    <rect x="38" y="756" width="216" height="128" rx="6"/>
    <rect x="266" y="756" width="216" height="128" rx="6"/>
    <rect x="494" y="756" width="216" height="128" rx="6"/>
    <rect x="722" y="756" width="216" height="128" rx="6"/>
    <rect x="950" y="756" width="216" height="128" rx="6"/>
  </g>
  <path d="M 254 786 L 265 786" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#gray-arrow)"/>
  <g font-size="13" font-weight="600" fill="#2563eb">
    <text x="52" y="779" font-size="12.5">Stage 1 (first 1,650 steps)</text>
    <text x="280" y="779">Stage 2</text>
    <text x="508" y="779">Soft targets</text>
    <text x="736" y="779">Hidden descriptions</text>
    <text x="964" y="779">Fallback option</text>
  </g>
  <g font-size="12">
    <text x="52" y="802">
      <tspan x="52">Predict after Answer:</tspan>
      <tspan x="52" dy="18">&lt;|D1|&gt;: fitting options</tspan>
      <tspan x="52" dy="18">&lt;|D2|&gt;: other options</tspan>
      <tspan x="52" dy="18">Full-vocabulary</tspan>
      <tspan x="52" dy="18">cross-entropy</tspan>
    </text>
    <text x="280" y="802">
      <tspan x="280">Switch on scalar head</tspan>
      <tspan x="280" dy="18">Softmax over the menu</tspan>
      <tspan x="280" dy="18">+ same D1/D2 term</tspan>
    </text>
    <text x="508" y="802">
      <tspan x="508">Ambiguous questions:</tspan>
      <tspan x="508" dy="18">train toward a probability</tspan>
      <tspan x="508" dy="18">distribution</tspan>
    </text>
    <text x="736" y="802">
      <tspan x="736">Half the time, remove</tspan>
      <tspan x="736" dy="18">option descriptions</tspan>
    </text>
    <text x="964" y="802">
      <tspan x="964">Half the menus add a</tspan>
      <tspan x="964" dy="18">"none of these" option</tspan>
    </text>
  </g>
</svg>
